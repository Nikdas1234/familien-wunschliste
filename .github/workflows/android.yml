# Baut die Android-App (APK) und veröffentlicht sie als Release. Der Link
# https://github.com/Nikdas1234/familien-wunschliste/releases/latest/download/Wunschliste.apk
# zeigt damit immer auf die neueste Version.
# Die App lädt ihren Inhalt beim Start aus dem Internet (GitHub Pages). Änderungen an
# index.html, app.js, style.css usw. brauchen deshalb KEINE neue APK. Gebaut wird nur,
# wenn sich die Android-Hülle selbst ändert, und auf Knopfdruck ("Run workflow").
name: Android-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - offline.html
      - android/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - werkzeuge/www-bauen.js
      - .github/workflows/android.yml

# "write" ist nötig, um das Release anzulegen.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci --no-fund --no-audit

      - name: Web-Dateien in das Android-Projekt übernehmen
        run: npm run android:sync

      - name: Signaturschlüssel bereitlegen
        env:
          WL_KEYSTORE_B64: ${{ secrets.WL_KEYSTORE_B64 }}
        run: |
          test -n "$WL_KEYSTORE_B64" || { echo "Secret WL_KEYSTORE_B64 fehlt"; exit 1; }
          echo "$WL_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: APK bauen
        working-directory: android
        env:
          WL_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          WL_KEYSTORE_PASSWORD: ${{ secrets.WL_KEYSTORE_PASSWORD }}
          WL_KEY_ALIAS: wunschliste
          WL_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signatur prüfen und Datei benennen
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK" "Wunschliste-$VERSION-${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: Wunschliste-APK
          path: Wunschliste-*.apk
          if-no-files-found: error

      - name: Als Release veröffentlichen (fester Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "Wunschliste-$VERSION-${{ github.run_number }}.apk" Wunschliste.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" Wunschliste.apk --clobber
          else
            gh release create "v$VERSION" Wunschliste.apk               --target "$GITHUB_SHA"               --title "Wunschliste $VERSION"               --notes "Android-App zum direkten Installieren: Wunschliste.apk herunterladen und antippen."               --latest
          fi
